# VoidPE - чат и ник над головой (плагин VoidChat)
# Куда: <папка сервера>\plugins\VoidChat\config.yml
# Читается один раз при включении -> после правки нужен рестарт сервера.
# Файла может не быть: тогда работают те же значения, что ниже (по умолчанию).

# Радиус локального чата в блоках (по прямой линии, в одном мире)
radius: 100

# Символ, с которого начинается сообщение в общий чат
global-symbol: "!"

# {player} = ник игрока, {message} = текст сообщения
# НЕ используй {%0}/{%1}: ядро PNX съедает любой "%<слово>" в строке формата
# (BaseLang.parseLanguageText) — в чате останутся фигурные скобки.

# Локальный чат - без метки перед ником
format-local: "§f{player}§8 » §7{message}"

# Глобальный чат - метка [G]
format-global: "§8[§6G§8] §f{player}§8 » §7{message}"

# КД между сообщениями, в секундах (0 = выключить). Опам/админам не действует.
cooldown-seconds: 2
cooldown-message: "§7Не так быстро: подожди ещё §f{seconds}§7 сек."

# Ник над головой
nametag-enabled: true
nametag: "§8[§6VoidPE§8] §f{player}"
