# VoidPE - настройки чата (плагин VoidChat)
# Куда: <папка сервера>\plugins\VoidChat\config.yml
# Файл НЕ обязателен: если его нет, плагин работает на этих же значениях по умолчанию.
# Читается один раз при включении -> после правки нужен рестарт сервера.

# Радиус локального чата (в блоках, по прямой линии)
radius: 100

# Символ, с которого начинается сообщение в общий чат
global-symbol: "!"

# {%0} = ник игрока, {%1} = текст сообщения. Эти подстановки делает само ядро PNX.
# ВАЖНО: коды цвета пишутся обычным символом § (в файле он уже есть).

# Локальный чат - без никаких меток перед ником
format-local: "§f{%0}§8 » §7{%1}"

# Глобальный чат - метка [G]
format-global: "§8[§6G§8] §f{%0}§8 » §7{%1}"

# Писать игроку подсказку, если его в радиусе никто не слышит
hint-when-alone: true
hint-when-alone-message: "§7Тебя никто не слышит. Начни сообщение с §f!§7, чтобы писать в общий чат"
