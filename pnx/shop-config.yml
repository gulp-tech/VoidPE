# =====================================================================
#  VoidPE / anarchy — конфиг магазина ShopUI (PowerNukkitX 3.0.5)
#  Куда положить:  <папка сервера>\plugins\ShopUI\config.yml
#  (после первого запуска сервера, чтобы папка ShopUI уже существовала)
#
#  Экономика: LlamaEconomy, стартовый баланс по умолчанию 1000.
#  Команды: /shop (купить), /sell (продать), /sell hand, /sell all
#
#  Логика цен анархии:
#   - ПРОДАЖА ресурсов выгодна, чтобы игрок мог подняться с нуля
#     (руда, урожай, мобы) — это основной заработок на анархии;
#   - ПОКУПКА только расходников и утилит (еда, стрелы, вёдра, факелы,
#     базовые блоки) — чтобы не убить смысл гринда;
#   - ничего «топового» (алмазная броня/элитры/незерит) в продаже нет —
#     это добывается только в мире. Иначе анархия превращается в песочницу.
#
#  Формат записи:
#    item: 'minecraft:<id>'   — идентификатор PNX
#    amount: <1..64>          — размер пачки (шаг ползунка количества)
#    buy:  <цена>             — цена за пачку при покупке (-1/убрать = нельзя купить)
#    sell: <цена>             — цена за пачку при продаже (-1/убрать = нельзя продать)
#    thumbnail/icon           — путь к текстуре Bedrock (опционально)
# =====================================================================

