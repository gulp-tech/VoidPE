# VoidPE — формат чата и ников (PlaceholderChat)
# Куда: <папка сервера>\plugins\PlaceholderChat\config.yml
# Конфиг читается ОДИН раз при включении плагина -> после правки нужен рестарт сервера.
#
# Доступные плейсхолдеры (PlaceholderAPI):
#   %player% %player_displayname% %player_nametag% %player_uuid% %player_xuid%
#   %player_ping% %player_health% %player_max_health% %player_food% %player_saturation%
#   %player_gamemode% %player_exp% %player_exp_level% %player_platform% %player_pos%
#   %player_item% %player_offhand% %player_level% (= название мира, не уровень опыта!)
#   %server_online% %server_max_players% %server_motd% %server_tps% %server_cpu%
#   %server_difficulty% %server_version% %server_protocol% %server_tick%
#   %time%  %time;HH:mm%   %money% (LlamaEconomy, если PlaceholderAPI включён раньше неё)
#   %message% — текст сообщения игрока (регистрирует сам PlaceholderChat)
#
# НЕ работает: %luckperms_prefix% — LuckPerms в сборке PNX не регистрирует плейсхолдеры,
# неизвестный плейсхолдер остаётся в чате как обычный текст.

nametag: "§8[§6VoidPE§8] §f%player_displayname%"

chatmessage: "§8[§6§lVoidPE§8] §f%player_displayname% §8» §7%message%"
